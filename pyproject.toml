[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "swarmresearch"
version = "0.1.0"
description = "Multiagent deep-research assistant on a hand-rolled async orchestration runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay John Xavier" }]
keywords = ["multiagent", "orchestration", "deep-research", "rag", "asyncio"]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pytest>=8.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "ruff>=0.4",
]

[project.optional-dependencies]
# Reserved for optional extras (e.g. a vector store). Core stays light on purpose.

[project.scripts]
swarm = "swarm.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
